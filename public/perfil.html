<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>
    <style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:linear-gradient(135deg,#120720,#2d1b47,#1a0a2e);min-height:100vh;color:white;padding:20px}.back{padding:12px 20px;background:rgba(167,139,250,.2);border-radius:10px;cursor:pointer;display:inline-block;margin-bottom:30px}.card{background:rgba(45,27,71,.6);border-radius:20px;padding:30px;max-width:400px;margin:0 auto;text-align:center}.avatar{width:100px;height:100px;border-radius:50%;background:#3a2454;display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto 20px;border:3px solid #a78bfa}.name{font-size:24px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:5px}.zid{color:#a78bfa;margin-bottom:20px}.verified{width:20px;height:20px;background:#10b981;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}.verified::after{content:"✓"}.btn{margin-top:20px;padding:12px 30px;background:linear-gradient(90deg,#7c3aed,#a855f7);border:none;border-radius:10px;color:white;font-size:16px;cursor:pointer}</style>
</head>
<body>
    <div class="back" onclick="window.location.href='index.html'">← Voltar</div>
    <div class="card">
        <div class="avatar">👤</div>
        <div class="name">Naoki <span class="verified">✓</span></div>
        <div class="zid">Z-ID: #000001</div>
        <button class="btn">✏️ Editar Perfil</button>
    </div>
</body>
</html>
