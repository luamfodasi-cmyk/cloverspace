<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Sala / Chat</title>
    <style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:linear-gradient(135deg,#120720,#2d1b47,#1a0a2e);min-height:100vh;color:white;padding:20px}.back{padding:12px 20px;background:rgba(167,139,250,.2);border-radius:10px;cursor:pointer;display:inline-block;margin-bottom:30px}h1{text-align:center;margin-bottom:30px;font-size:24px}.form-card{background:rgba(45,27,71,.6);border-radius:16px;padding:25px;border:1px solid rgba(167,139,250,.2);max-width:450px;margin:0 auto}label{display:block;margin-bottom:8px;color:#a78bfa;font-size:14px}input,select,textarea{width:100%;padding:12px 15px;border-radius:10px;border:1px solid rgba(167,139,250,.3);background:rgba(18,7,32,.6);color:white;font-size:15px;margin-bottom:20px;outline:none}input:focus,select:focus,textarea:focus{border-color:#a78bfa}button{width:100%;padding:14px;background:linear-gradient(90deg,#7c3aed,#a855f7);border:none;border-radius:12px;color:white;font-size:16px;font-weight:bold;cursor:pointer}</style>
</head>
<body>
    <div class="back" onclick="window.location.href='criar.html'">← Voltar</div>
    <h1>💬 Criar Sala / Chat</h1>
    <div class="form-card"><label>Nome da Sala</label><input type="text" placeholder="Ex: Festa dos Amigos 🎉"><label>Tipo</label><select><option>Pública — Todos podem entrar</option><option>Privada — Somente convidados</option></select><label>Descrição</label><textarea rows="3" placeholder="Sobre o que é essa sala?"></textarea><button onclick="alert('✅ Sala criada!'); window.location.href='index.html'">Criar 🚀</button></div>
</body>
</html>
