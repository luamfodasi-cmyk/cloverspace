<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloverSpace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: linear-gradient(135deg,#120720,#2d1b47,#1a0a2e); min-height: 100vh; color: white; padding: 20px; padding-bottom: 80px; }
        .header { display: flex; align-items: center; gap: 12px; padding: 20px 0; cursor: pointer; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #3a2454; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid #a78bfa; }
        .name { font-size: 18px; font-weight: bold; }
        .status { font-size: 13px; color: #4ade80; }
        .center-circle { position: relative; width: 280px; height: 280px; margin: 30px auto; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(167,139,250,.3); }
        .ring-1 { width: 100%; height: 100%; animation: pulse 3s infinite; }
        .ring-2 { width: 80%; height: 80%; top: 10%; left: 10%; }
        .ring-3 { width: 60%; height: 60%; top: 20%; left: 20%; }
        .center-z { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 80px; font-weight: bold; color: #fbbf24; text-shadow: 0 0 30px #fbbf24; cursor: pointer; }
        @keyframes pulse { 0%,100%{opacity: .3} 50%{opacity: .6} }
        .cards { display: grid; grid-template-columns: repeat(2,1fr); gap: 15px; margin: 30px 0; }
        .card { background: rgba(45,27,71,.6); padding: 25px; border-radius: 15px; text-align: center; cursor: pointer; border: 1px solid rgba(167,139,250,.2); }
        .card:hover { border-color: #a78bfa; }
        .card-icon { font-size: 35px; margin-bottom: 10px; }
        .section-title { font-size: 20px; font-weight: bold; margin: 40px 0 20px; color: #a78bfa; }
        .empty-area { background: rgba(45,27,71,.3); border: 2px dashed rgba(167,139,250,.3); border-radius: 15px; padding: 60px 20px; text-align: center; color: #9ca3af; }
        .empty-icon { font-size: 40px; margin-bottom: 10px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(18,7,32,.95); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid rgba(167,139,250,.2); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: #9ca3af; cursor: pointer; }
        .nav-item.active { color: #a78bfa; }
        .nav-icon { font-size: 22px; }
        .nav-center { width: 55px; height: 55px; border-radius: 50%; background: linear-gradient(135deg,#7c3aed,#22c55e); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header" onclick="window.location.href='perfil.html'">
        <div class="avatar">👤</div>
        <div><div class="name">Naoki</div><div class="status">● Online — Clique aqui!</div></div>
    </div>
    <div class="center-circle">
        <div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
        <div class="center-z" onclick="window.location.href='inicio.html'">Z</div>
    </div>
    <div class="cards">
        <div class="card" onclick="window.location.href='text-meet.html'"><div class="card-icon">💬</div><div>Text Meet</div></div>
        <div class="card" onclick="window.location.href='voice-meet.html'"><div class="card-icon">🎙️</div><div>Voice Meet</div></div>
    </div>
    <h2 class="section-title">Live Parties</h2>
    <div class="empty-area"><div class="empty-icon">🎉</div><p>Nenhuma festa ainda</p><p style="font-size:13px;margin-top:5px">Crie sua primeira festa aqui!</p></div>
    <div class="bottom-nav">
        <div class="nav-item active" onclick="window.location.href='index.html'"><span class="nav-icon">💎</span><span>Discover</span></div>
        <div class="nav-item" onclick="window.location.href='circulos.html'"><span class="nav-icon">⊞</span><span>Circles</span></div>
        <div class="nav-center" onclick="window.location.href='criar-sala.html'">+</div>
        <div class="nav-item" onclick="window.location.href='chats.html'"><span class="nav-icon">💬</span><span>Chats</span></div>
        <div class="nav-item" onclick="window.location.href='loja.html'"><span class="nav-icon">🛍️</span><span>Marketplace</span></div>
    </div>
</body>
</html>
