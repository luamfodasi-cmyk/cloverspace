<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloverSpace</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#09060f;
  color:#fff;
  font-family:Arial,sans-serif;
}
main{max-width:600px;margin:auto;padding:20px}
h1{color:#c77dff}
.card{
  background:#151020;
  border:1px solid #332342;
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
}
input,textarea{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:12px;
  border:1px solid #443050;
  background:#0d0913;
  color:white;
}
textarea{min-height:100px;resize:vertical}
button{
  width:100%;
  padding:14px;
  margin-top:9px;
  border:0;
  border-radius:12px;
  background:#8b4dff;
  color:white;
  font-weight:bold;
}
button:active{transform:scale(.98)}
.hidden{display:none}
.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #a95cff;
}
.center{text-align:center}
.verified{color:#55aaff}
.admin{color:#d18aff;margin-top:5px}
.msg{margin-top:10px}
.error{color:#ff6688}
.success{color:#5cff9a}
hr{border:0;border-top:1px solid #30203e;margin:22px 0}
</style>
</head>

<body>

<main>

<!-- LOGIN -->
<section id="loginBox" class="card">

<h1>🌿 CloverSpace</h1>
<p>Entre na sua conta.</p>

<input id="loginUsername" placeholder="Usuário">
<input id="loginPassword" type="password" placeholder="Senha">

<button onclick="login()">Entrar</button>
<button onclick="showRegister()">Criar conta</button>

<div id="loginMsg" class="msg"></div>

</section>


<!-- CADASTRO -->
<section id="registerBox" class="card hidden">

<h1>🌿 Criar conta</h1>

<input id="registerUsername" placeholder="Usuário">
<input id="registerPassword" type="password" placeholder="Senha">

<button onclick="register()">Criar conta</button>
<button onclick="showLogin()">Voltar</button>

<div id="registerMsg" class="msg"></div>

</section>


<!-- PERFIL -->
<section id="profileBox" class="hidden">

<div class="card center">

<h1>Meu perfil</h1>

<img id="avatar" class="avatar">

<h2 id="profileName"></h2>

<div id="verified" class="verified"></div>
<div id="admin" class="admin"></div>

</div>


<div class="card">

<h2>✏️ Editar perfil</h2>

<label>Nome de usuário</label>
<input id="editUsername">

<label>Bio</label>
<textarea id="editBio" maxlength="300"></textarea>

<button onclick="saveProfile()">Salvar perfil</button>

<div id="profileMsg" class="msg"></div>

</div>


<div class="card">

<h2>📷 Foto de perfil</h2>

<input
  id="avatarInput"
  type="file"
  accept="image/jpeg,image/png,image/webp"
>

<button onclick="uploadAvatar()">Trocar foto</button>

</div>


<div class="card">

<button onclick="logout()">Sair da conta</button>

</div>

</section>

</main>


<script>

let token = localStorage.getItem("clover_token");
let currentUser = null;


/* TELAS */

function showRegister(){

  document.getElementById("loginBox").classList.add("hidden");

  document.getElementById("registerBox")
    .classList.remove("hidden");
}


function showLogin(){

  document.getElementById("registerBox")
    .classList.add("hidden");

  document.getElementById("loginBox")
    .classList.remove("hidden");
}


/* CADASTRO */

async function register(){

  const username =
    document.getElementById("registerUsername").value.trim();

  const password =
    document.getElementById("registerPassword").value;

  const msg =
    document.getElementById("registerMsg");

  msg.textContent="";

  try{

    const response = await fetch("/api/register",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        username,
        password
      })

    });

    const data = await response.json();

    if(!response.ok){

      msg.className="msg error";
      msg.textContent=data.error;
      return;
    }

    msg.className="msg success";
    msg.textContent="Conta criada com sucesso!";

    document.getElementById("registerUsername").value="";
    document.getElementById("registerPassword").value="";

    setTimeout(showLogin,800);

  }catch(error){

    msg.className="msg error";
    msg.textContent="Erro de conexão.";

  }
}


/* LOGIN */

async function login(){

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const msg =
    document.getElementById("loginMsg");

  msg.textContent="";

  try{

    const response = await fetch("/api/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        username,
        password
      })

    });

    const data = await response.json();

    if(!response.ok){

      msg.className="msg error";
      msg.textContent=data.error;
      return;
    }

    token=data.token;

    localStorage.setItem(
      "clover_token",
      token
    );

    currentUser=data.user;

    showProfile();

  }catch(error){

    msg.className="msg error";
    msg.textContent="Erro de conexão.";

  }
}


/* PERFIL */

function showProfile(){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("registerBox")
    .classList.add("hidden");

  document.getElementById("profileBox")
    .classList.remove("hidden");

  updateProfile();
}


function updateProfile(){

  if(!currentUser)return;

  document.getElementById("profileName")
    .textContent=currentUser.username;

  document.getElementById("editUsername")
    .value=currentUser.username;

  document.getElementById("editBio")
    .value=currentUser.bio || "";

  document.getElementById("verified")
    .textContent=currentUser.verified
      ?"✔ Conta verificada":"";

  document.getElementById("admin")
    .textContent=currentUser.admin
      ?"👑 Administrador do CloverSpace":"";

  const avatar =
    document.getElementById("avatar");

  if(currentUser.avatar){

    avatar.src=currentUser.avatar;

  }else{

    avatar.src=
      "https://ui-avatars.com/api/?name="+
      encodeURIComponent(currentUser.username)+
      "&background=241531&color=ffffff";

  }
}


/* SALVAR PERFIL */

async function saveProfile(){

  const username =
    document.getElementById("editUsername")
      .value.trim();

  const bio =
    document.getElementById("editBio").value;

  const msg =
    document.getElementById("profileMsg");

  try{

    const response = await fetch("/api/profile",{

      method:"PUT",

      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+token
      },

      body:JSON.stringify({
        username,
        bio
      })

    });

    const data=await response.json();

    if(!response.ok){

      msg.className="msg error";
      msg.textContent=data.error;
      return;
    }

    currentUser=data.user;

    updateProfile();

    msg.className="msg success";
    msg.textContent="Perfil salvo!";

  }catch(error){

    msg.className="msg error";
    msg.textContent="Erro ao salvar.";

  }
}


/* FOTO */

async function uploadAvatar(){

  const input =
    document.getElementById("avatarInput");

  if(!input.files.length){

    document.getElementById("profileMsg").textContent="Escolha uma foto primeiro.";
    return;
  }

  const formData=new FormData();

  formData.append(
    "avatar",
    input.files[0]
  );

  const response=await fetch(
    "/api/profile/avatar",
    {
      method:"POST",

      headers:{
        "Authorization":"Bearer "+token
      },

      body:formData
    }
  );

  const data=await response.json();

  const msg =
    document.getElementById("profileMsg");

  if(!response.ok){

    msg.className="msg error";
    msg.textContent=data.error;
    return;
  }

  currentUser.avatar=data.avatar;

  updateProfile();

  input.value="";

  msg.className="msg success";
  msg.textContent="Foto atualizada!";
}


/* LOGOUT */

async function logout(){

  try{

    await fetch("/api/logout",{

      method:"POST",

      headers:{
        "Authorization":"Bearer "+token
      }

    });

  }catch(error){}

  localStorage.removeItem("clover_token");

  token=null;
  currentUser=null;

  document.getElementById("profileBox")
    .classList.add("hidden");

  showLogin();
}


/* RECUPERAR SESSÃO */

async function loadSession(){

  if(!token)return;

  try{

    const response=await fetch("/api/me",{

      headers:{
        "Authorization":"Bearer "+token
      }

    });

    if(!response.ok){

      localStorage.removeItem("clover_token");
      token=null;
      return;
    }

    currentUser=await response.json();

    showProfile();

  }catch(error){

    console.log("Sessão não carregada.");

  }
}

loadSession();

</script>

</body>
</html>
