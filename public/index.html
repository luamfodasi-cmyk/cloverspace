<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CloverSpace</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#06140d,#0b3520,#06140d);
  color:white;
  display:flex;
  justify-content:center;
  padding:25px;
}

.container{width:100%;max-width:500px}

.logo{text-align:center;font-size:60px}

h1{text-align:center;font-size:38px;margin:5px 0 25px}
.green{color:#43e879}

.card{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  border-radius:22px;
  padding:25px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:14px;
  margin:6px 0;
  border:0;
  border-radius:12px;
  background:rgba(0,0,0,.3);
  color:white;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.primary{background:#43e879;color:#06200f}
.secondary{background:rgba(255,255,255,.1);color:white}

.hidden{display:none}

.profile{
  text-align:center;
}

.avatar{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  background:#43e879;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  color:#06200f;
}

.name{
  font-size:25px;
  font-weight:bold;
  margin-top:12px;
}

.verified{
  color:#43e879;
  font-size:20px;
  margin-left:5px;
}

.badge{
  display:inline-block;
  margin-top:8px;
  padding:6px 12px;
  border-radius:20px;
  background:rgba(67,232,121,.15);
  color:#43e879;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">🌿</div>
<h1>Clover<span class="green">Space</span></h1>

<div id="inicio" class="card">

<h2>Bem-vindo 👋</h2>

<button class="primary" onclick="mostrar('cadastro')">
🚀 Criar minha conta
</button>

<button class="secondary" onclick="mostrar('login')">
🔐 Entrar
</button>

</div>

<div id="cadastro" class="card hidden">

<h2>Criar conta</h2>

<input id="nome" placeholder="Seu nome">
<input id="email" placeholder="Seu e-mail">
<input id="senha" type="password" placeholder="Sua senha">

<button class="primary" onclick="cadastrar()">
Criar conta
</button>

<button class="secondary" onclick="mostrar('inicio')">
Voltar
</button>

<p id="msgCadastro"></p>

</div>

<div id="login" class="card hidden">

<h2>Entrar</h2>

<input id="emailLogin" placeholder="Seu e-mail">
<input id="senhaLogin" type="password" placeholder="Sua senha">

<button class="primary" onclick="entrar()">
Entrar
</button>

<button class="secondary" onclick="mostrar('inicio')">
Voltar
</button>

<p id="msgLogin"></p>

</div>

<div id="perfil" class="card hidden profile">

<div class="avatar">👤</div>

<div class="name">
<span id="nomePerfil"></span>
<span class="verified">✓</span>
</div>

<div class="badge">
✓ Verificado
</div>

<p style="margin-top:10px;color:#aaa">
👑 Administrador do CloverSpace
</p>

<button class="primary">
👥 Amigos
</button>

<button class="primary">
💬 Conversas
</button>

<button class="primary">
🎙️ Salas de voz
</button>

<button class="primary">
🌎 Comunidades
</button>

<button class="secondary" onclick="sair()">
Sair
</button>

</div>

</div>

<script>

function mostrar(id){
  document.querySelectorAll(".card")
    .forEach(x=>x.classList.add("hidden"));

  document.getElementById(id)
    .classList.remove("hidden");
}

async function cadastrar(){

  const nome=document.getElementById("nome").value;
  const email=document.getElementById("email").value;
  const senha=document.getElementById("senha").value;

  const resposta=await fetch("/api/register",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      username:email,
      password:senha
    })
  });

  const dados=await resposta.json();

  if(!resposta.ok){
    document.getElementById("msgCadastro").textContent=dados.error;
    return;
  }

  localStorage.setItem("cloverNome",nome);

  alert("Conta criada com sucesso!");
  mostrar("login");
}

async function entrar(){

  const email=document.getElementById("emailLogin").value;
  const senha=document.getElementById("senhaLogin").value;

  const resposta=await fetch("/api/login",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      username:email,
      password:senha
    })
  });

  const dados=await resposta.json();

  if(!resposta.ok){
    document.getElementById("msgLogin").textContent=dados.error;
    return;
  }

  const nome=localStorage.getItem("cloverNome") || dados.user.username;

  document.getElementById("nomePerfil").textContent=nome;

  mostrar("perfil");
}

function sair(){
  mostrar("inicio");
}

</script>

</body>
</html>
