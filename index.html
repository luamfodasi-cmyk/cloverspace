<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil — CloverSpace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #120720 0%, #2d1b47 50%, #1a0a2e 100%);
            min-height: 100vh;
            color: white;
            padding-bottom: 30px;
        }

        .back-btn {
            padding: 15px 20px;
            font-size: 24px;
            cursor: pointer;
            color: #a78bfa;
        }

        .profile-container {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
        }

        .profile-header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(45, 27, 71, 0.6);
            border-radius: 20px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            margin-bottom: 20px;
        }

        .avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #3a2454;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            border: 3px solid #a78bfa;
            margin: 0 auto 15px;
            position: relative;
        }

        /* ===== 🏅 SELOS CORRETOS ===== */
        .badges {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 12px;
            align-items: center;
        }

        /* Selo Desenvolvedor */
        .badge-dev {
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .badge-dev::before {
            content: "👨‍💻";
            font-size: 12px;
        }

        /* ✅ SELO VERIFICADO — O VERDE CLÁSSICO! */
        .badge-verified {
            background: #16a34a;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }
        .badge-verified::after {
            content: "✓";
            font-size: 14px;
            font-weight: 900;
        }

        .profile-name {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .profile-status {
            color: #4ade80;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .profile-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .stat { text-align: center; }
        .stat-value { font-size: 22px; font-weight: bold; color: #a78bfa; }
        .stat-label { font-size: 12px; color: #9ca3af; }

        .edit-btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .edit-btn:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(124, 58, 237, 0.4); }

        .info-card {
            background: rgba(45, 27, 71, 0.6);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            margin-top: 15px;
        }

        .info-title {
            font-size: 14px;
            color: #a78bfa;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 16px;
            color: white;
        }

        .bio {
            line-height: 1.6;
            color: #d1d5db;
        }
    </style>
</head>
<body>

    <div class="back-btn" onclick="window.location.href='index.html'">←</div>

    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar-large">👤</div>

            <!-- 🏅 SELOS NA FRENTE DO NOME! -->
            <div class="badges">
                <span class="badge-dev">Desenvolvedor</span>
                <span class="badge-verified" title="Verificado"></span>
            </div>

            <h1 class="profile-name">CloverSpace</h1>
            <p class="profile-status">● Online — Criador do Projeto</p>

            <div class="profile-stats">
                <div class="stat">
                    <div class="stat-value">1.2k</div>
                    <div class="stat-label">Seguidores</div>
                </div>
                <div class="stat">
                    <div class="stat-value">48</div>
                    <div class="stat-label">Salas</div>
                </div>
                <div class="stat">
                    <div class="stat-value">∞</div>
                    <div class="stat-label">Experiência</div>
                </div>
            </div>

            <button class="edit-btn" onclick="alert('Abrindo edição de perfil...')">✏️ Editar Perfil</button>
        </div>

        <div class="info-card">
            <div class="info-title">Sobre mim</div>
            <p class="bio">Olá! Sou o criador e desenvolvedor do CloverSpace. 🎉 Desenvolvendo com paixão para conectar pessoas de todo o mundo! 🌐✨</p>
        </div>

        <div class="info-card">
            <div class="info-title">Nome de usuário</div>
            <div class="info-value">@luamfodasi-cmyk</div>
        </div>

        <div class="info-card">
            <div class="info-title">Membro desde</div>
            <div class="info-value">Setembro de 2026</div>
        </div>
    </div>

</body>
</html>
