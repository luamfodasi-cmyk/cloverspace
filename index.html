<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloverSpace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #120720 0%, #2d1b47 50%, #1a0a2e 100%);
            min-height: 100vh;
            color: white;
            padding-bottom: 80px;
            position: relative;
            overflow-x: hidden;
        }

        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: #a78bfa; border-radius: 50%;
            box-shadow: 0 0 10px #a78bfa, 0 0 20px #7c3aed;
            animation: float 15s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; position: relative; z-index: 10;
        }
        .profile { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background: #3a2454; display: flex; align-items: center; justify-content: center;
            font-size: 20px; border: 2px solid #a78bfa;
        }
        .name { font-size: 18px; font-weight: bold; }
        .status { font-size: 12px; color: #4ade80; }
        .header-icons { display: flex; gap: 12px; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(99, 102, 241, 0.2); border: none; color: white;
            font-size: 18px; cursor: pointer; transition: 0.2s;
        }
        .icon-btn:hover { background: rgba(167, 139, 250, 0.4); transform: scale(1.1); }

        .gift-banner {
            background: linear-gradient(90deg, #b45309, #f59e0b);
            margin: 15px 20px; border-radius: 12px; padding: 12px 20px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold; cursor: pointer; transition: 0.3s;
            position: relative; z-index: 10;
        }
        .gift-banner:hover { transform: scale(1.02); box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }

        .center-circle {
            position: relative; width: 280px; height: 280px; margin: 10px auto;
            z-index: 10;
        }
        .ring {
            position: absolute; border-radius: 50%; border: 2px solid rgba(167, 139, 250, 0.3);
        }
        .ring-1 { width: 100%; height: 100%; animation: pulse 3s infinite; }
        .ring-2 { width: 80%; height: 80%; top: 10%; left: 10%; }
        .ring-3 { width: 60%; height: 60%; top: 20%; left: 20%; }
        .center-z {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; font-weight: bold; color: #fbbf24;
            text-shadow: 0 0 30px #fbbf24; cursor: pointer;
            transition: 0.3s;
        }
        .center-z:hover { text-shadow: 0 0 50px #fbbf24, 0 0 80px #f59e0b; }
        .orbit-icon {
            position: absolute; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(124, 58, 237, 0.5); display: flex; align-items: center;
            justify-content: center; font-size: 22px; border: 2px solid #a78bfa;
            cursor: pointer; transition: 0.3s;
        }
        .orbit-icon:hover { transform: scale(1.2); background: rgba(167, 139, 250, 0.7); }
        .orbit-1 { top: 10px; right: 10px; }
        .orbit-2 { bottom: 20px; left: 50%; transform: translateX(-50%); }
        .orbit-2:hover { transform: translateX(-50%) scale(1.2); }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .cards-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            padding: 20px; position: relative; z-index: 10;
        }
        .card {
            background: rgba(45, 27, 71, 0.6); border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 16px; padding: 20px 12px; text-align: center;
            cursor: pointer; transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-5px); border-color: #a78bfa;
            box-shadow: 0 10px 25px rgba(167, 139, 250, 0.2);
        }
        .card.blue { background: rgba(30, 64, 175, 0.3); }
        .card.green { background: rgba(21, 128, 61, 0.3); }
        .card.purple { background: rgba(88, 28, 135, 0.3); }
        .card-badge { font-size: 12px; color: #a78bfa; margin-bottom: 8px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .card-icon { font-size: 28px; }

        .section { padding: 0 20px; margin-top: 10px; position: relative; z-index: 10; }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
        }
        .section-title { font-size: 22px; font-weight: bold; }
        .see-all { color: #a78bfa; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .see-all:hover { color: #c4b5fd; text-decoration: underline; }
        .tags { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .tag {
            color: #c4b5fd; font-size: 14px; padding: 6px 14px; border-radius: 20px;
            cursor: pointer; transition: 0.2s;
        }
        .tag:hover { background: rgba(167, 139, 250, 0.15); }
        .tag.active { background: rgba(167, 139, 250, 0.2); color: white; }
        .rooms-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
        }
        .room-card {
            background: rgba(45, 27, 71, 0.6); border-radius: 12px; padding: 15px 10px;
            text-align: center; font-size: 13px; border: 1px solid rgba(167, 139, 250, 0.1);
            cursor: pointer; transition: 0.3s;
        }
        .room-card:hover {
            transform: translateY(-3px); border-color: #a78bfa;
            box-shadow: 0 5px 15px rgba(167, 139, 250, 0.15);
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(18, 7, 32, 0.95);
            display: flex; justify-content: space-around; padding: 10px 0;
            border-top: 1px solid rgba(167, 139, 250, 0.2);
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 11px; color: #9ca3af; cursor: pointer;
            transition: 0.2s;
        }
        .nav-item:hover { color: #c4b5fd; }
        .nav-item.active { color: #a78bfa; }
        .nav-icon { font-size: 22px; }
        .nav-center {
            width: 55px; height: 55px; border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #22c55e);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin-top: -20px;
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
            cursor: pointer; transition: 0.3s;
        }
        .nav-center:hover { transform: scale(1.1); box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5); }
    </style>
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="header">
        <div class="profile" onclick="window.location.href='perfil.html'">
            <div class="avatar">👤</div>
            <div>
                <div class="name">CloverSpace</div>
                <div class="status">● Online</div>
            </div>
        </div>
        <div class="header-icons">
            <button class="icon-btn" onclick="window.location.href='pesquisa.html'">🔍</button>
            <button class="icon-btn" onclick="window.location.href='anuncios.html'">📢</button>
            <button class="icon-btn" onclick="window.location.href='notificacoes.html'">🔔</button>
        </div>
    </div>

    <div class="gift-banner" onclick="window.location.href='presente.html'">🎁 Here's a gift for you!</div>

    <div class="center-circle">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="center-z" onclick="window.location.href='inicio.html'">Z</div>
        <div class="orbit-icon orbit-1" onclick="window.location.href='mundo.html'">🌐</div>
        <div class="orbit-icon orbit-2" onclick="window.location.href='perfil.html'">👤</div>
    </div>

    <div class="cards-container">
        <div class="card blue" onclick="window.location.href='text-meet.html'">
            <div class="card-badge">20 remaining</div>
            <div class="card-title">Text Meet</div>
            <div class="card-icon">💬</div>
        </div>
        <div class="card green" onclick="window.location.href='voice-meet.html'">
            <div class="card-badge">20 remaining</div>
            <div class="card-title">Voice Meet</div>
            <div class="card-icon">🎙️</div>
        </div>
        <div class="card purple" onclick="window.location.href='garrafa.html'">
            <div class="card-title">Drifting Bottle</div>
            <div class="card-icon">🍾</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <h2 class="section-title">Live Parties</h2>
            <span class="see-all" onclick="window.location.href='todas-salas.html'">›</span>
        </div>
        <div class="tags">
            <span class="tag" onclick="window.location.href='filtro-roleplay.html'">Role play</span>
            <span class="tag active" onclick="window.location.href='filtro-conversas.html'">Conversaciones</span>
            <span class="tag" onclick="window.location.href='filtro-anime.html'">Anime y manga</span>
            <span class="tag" onclick="window.location.href='filtro-jogos.html'">Juegos</span>
        </div>
        <div class="rooms-grid">
            <div class="room-card" onclick="window.location.href='sala-grupo-humilde.html'">❄️ GRUPO HUMILDE...</div>
            <div class="room-card" onclick="window.location.href='sala-harry-potter.html'">Harry Potter Rol</div>
            <div class="room-card" onclick="window.location.href='sala-deimos.html'">El chat de DEIMOS</div>
            <div class="room-card" onclick="window.location.href='sala-pal-tacate.html'">PAL TACATE</div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="window.location.href='index.html'">
            <span class="nav-icon">💎</span>
            <span>Discover</span>
        </div>
        <div class="nav-item" onclick="window.location.href='circulos.html'">
            <span class="nav-icon">⊞</span>
            <span>Circles</span>
        </div>
        <div class="nav-center" onclick="window.location.href='criar-sala.html'">+</div>
        <div class="nav-item" onclick="window.location.href='chats.html'">
            <span class="nav-icon">💬</span>
            <span>Chats</span>
        </div>
        <div class="nav-item" onclick="window.location.href='loja.html'">
            <span class="nav-icon">🛍️</span>
            <span>Marketplace</span>
        </div>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        const particleCount = 60;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 4 + 2;
            const posX = Math.random() * 100;
            const delay = Math.random() * 15;
            const duration = Math.random() * 10 + 10;
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = posX + '%';
            particle.style.animationDelay = delay + 's';
            particle.style.animationDuration = duration + 's';
            
            particlesContainer.appendChild(particle);
        }
    </script>

</body>
</html>
