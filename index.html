<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloverSpace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #120720 0%, #2d1b47 50%, #1a0a2e 100%);
            min-height: 100vh;
            color: white;
            padding-bottom: 80px;
        }

        /* ===== CABEÇALHO ===== */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px;
        }
        .profile { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 45px; height: 45px; border-radius: 50%;
            background: #3a2454; display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .name { font-size: 18px; font-weight: bold; }
        .status { font-size: 12px; color: #4ade80; }
        .header-icons { display: flex; gap: 12px; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(99, 102, 241, 0.2); border: none; color: white;
            font-size: 18px; cursor: pointer;
        }

        /* ===== GIFT BANNER ===== */
        .gift-banner {
            background: linear-gradient(90deg, #b45309, #f59e0b);
            margin: 15px 20px; border-radius: 12px; padding: 12px 20px;
            display: flex; align-items: center; gap: 10px;
            font-weight: bold;
        }

        /* ===== CÍRCULO CENTRAL ===== */
        .center-circle {
            position: relative; width: 280px; height: 280px; margin: 10px auto;
        }
        .ring {
            position: absolute; border-radius: 50%; border: 2px solid rgba(167, 139, 250, 0.3);
        }
        .ring-1 { width: 100%; height: 100%; animation: pulse 3s infinite; }
        .ring-2 { width: 80%; height: 80%; top: 10%; left: 10%; }
        .ring-3 { width: 60%; height: 60%; top: 20%; left: 20%; }
        .center-z {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 80px; font-weight: bold; color: #fbbf24;
            text-shadow: 0 0 30px #fbbf24;
        }
        .orbit-icon {
            position: absolute; width: 50px; height: 50px; border-radius: 50%;
            background: rgba(124, 58, 237, 0.5); display: flex; align-items: center;
            justify-content: center; font-size: 22px; border: 2px solid #a78bfa;
        }
        .orbit-1 { top: 10px; right: 10px; }
        .orbit-2 { bottom: 20px; left: 50%; transform: translateX(-50%); }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        /* ===== CARDS DE FUNÇÕES ===== */
        .cards-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            padding: 20px;
        }
        .card {
            background: rgba(45, 27, 71, 0.6); border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 16px; padding: 20px 12px; text-align: center;
            cursor: pointer; transition: 0.3s;
        }
        .card:hover {
            transform: translateY(-5px); border-color: #a78bfa;
            box-shadow: 0 10px 25px rgba(167, 139, 250, 0.2);
        }
        .card.blue { background: rgba(30, 64, 175, 0.3); }
        .card.green { background: rgba(21, 128, 61, 0.3); }
        .card.purple { background: rgba(88, 28, 135, 0.3); }
        .card-badge { font-size: 12px; color: #a78bfa; margin-bottom: 8px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .card-icon { font-size: 28px; }

        /* ===== LIVE PARTIES ===== */
        .section { padding: 0 20px; margin-top: 10px; }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
        }
        .section-title { font-size: 22px; font-weight: bold; }
        .see-all { color: #a78bfa; font-size: 14px; cursor: pointer; }
        .tags { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .tag { color: #c4b5fd; font-size: 14px; padding: 4px 10px; border-radius: 20px; }
        .tag.active { background: rgba(167, 139, 250, 0.2); color: white; }
        .rooms-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
        }
        .room-card {
            background: rgba(45, 27, 71, 0.6); border-radius: 12px; padding: 15px 10px;
            text-align: center; font-size: 13px; border: 1px solid rgba(167, 139, 250, 0.1);
        }

        /* ===== MENU INFERIOR ===== */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(18, 7, 32, 0.95);
            display: flex; justify-content: space-around; padding: 10px 0;
            border-top: 1px solid rgba(167, 139, 250, 0.2);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            font-size: 11px; color: #9ca3af; cursor: pointer;
        }
        .nav-item.active { color: #a78bfa; }
        .nav-icon { font-size: 22px; }
        .nav-center {
            width: 55px; height: 55px; border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #22c55e);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin-top: -20px;
            box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
        }
    </style>
</head>
<body>

    <!-- CABEÇALHO -->
    <div class="header">
        <div class="profile">
            <div class="avatar">👤</div>
            <div>
                <div class="name">CloverSpace</div>
                <div class="status">● Online</div>
            </div>
        </div>
        <div class="header-icons">
            <button class="icon-btn">🔍</button>
            <button class="icon-btn">📢</button>
            <button class="icon-btn">🔔</button>
        </div>
    </div>

    <!-- GIFT BANNER -->
    <div class="gift-banner">🎁 Here's a gift for you!</div>

    <!-- CÍRCULO CENTRAL -->
    <div class="center-circle">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
        <div class="center-z">Z</div>
        <div class="orbit-icon orbit-1">🌐</div>
        <div class="orbit-icon orbit-2">👤</div>
    </div>

    <!-- CARDS DE FUNÇÕES -->
    <div class="cards-container">
        <div class="card blue">
            <div class="card-badge">20 remaining</div>
            <div class="card-title">Text Meet</div>
            <div class="card-icon">💬</div>
        </div>
        <div class="card green">
            <div class="card-badge">20 remaining</div>
            <div class="card-title">Voice Meet</div>
            <div class="card-icon">🎙️</div>
        </div>
        <div class="card purple">
            <div class="card-title">Drifting Bottle</div>
            <div class="card-icon">🍾</div>
        </div>
    </div>

    <!-- LIVE PARTIES -->
    <div class="section">
        <div class="section-header">
            <h2 class="section-title">Live Parties</h2>
            <span class="see-all">›</span>
        </div>
        <div class="tags">
            <span class="tag">Role play</span>
            <span class="tag active">Conversaciones</span>
            <span class="tag">Anime y manga</span>
            <span class="tag">Juegos</span>
        </div>
        <div class="rooms-grid">
            <div class="room-card">❄️ GRUPO HUMILDE...</div>
            <div class="room-card">Harry Potter Rol</div>
            <div class="room-card">El chat de DEIMOS</div>
            <div class="room-card">PAL TACATE</div>
        </div>
    </div>

    <!-- MENU INFERIOR -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">💎</span>
            <span>Discover</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">⊞</span>
            <span>Circles</span>
        </div>
        <div class="nav-center">+</div>
        <div class="nav-item">
            <span class="nav-icon">💬</span>
            <span>Chats</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">🛍️</span>
            <span>Marketplace</span>
        </div>
    </div>

</body>
</html>
