<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar — CloverSpace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #120720, #2d1b47, #1a0a2e);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .back {
            padding: 12px 20px;
            background: rgba(167, 139, 250, 0.2);
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 30px;
        }
        h1 { text-align: center; margin-bottom: 30px; font-size: 26px; }
        .option-card {
            background: rgba(45, 27, 71, 0.6);
            border: 1px solid rgba(167, 139, 250, 0.2);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.3s;
        }
        .option-card:hover {
            border-color: #a78bfa;
            transform: translateY(-3px);
        }
        .option-icon { font-size: 40px; margin-bottom: 10px; }
        .option-title { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .option-desc { font-size: 14px; color: #9ca3af; }
    </style>
</head>
<body>
    <div class="back" onclick="window.location.href='index.html'">← Voltar</div>
    
    <h1>✨ O que você quer criar?</h1>

    <div class="option-card" onclick="window.location.href='criar-post.html'">
        <div class="option-icon">📝</div>
        <div class="option-title">Criar Post</div>
        <div class="option-desc">Compartilhe algo com todos!</div>
    </div>

    <div class="option-card" onclick="window.location.href='criar-chat.html'">
        <div class="option-icon">💬</div>
        <div class="option-title">Criar Chat / Sala</div>
        <div class="option-desc">Crie uma sala ou conversa nova!</div>
    </div>

</body>
</html>
