<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil — CloverSpace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #120720, #2d1b47, #1a0a2e);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .back {
            padding: 12px 20px;
            background: rgba(167, 139, 250, 0.2);
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 30px;
        }
        .profile-card {
            background: rgba(45, 27, 71, 0.6);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid rgba(167, 139, 250, 0.2);
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #3a2454;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
            margin: 0 auto 20px;
            border: 3px solid #a78bfa;
        }
        .name-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .name { font-size: 26px; font-weight: bold; }
        .verified {
            width: 22px;
            height: 22px;
            background: #10b981;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 900;
            color: white;
        }
        .verified::after { content: "✓"; }
        .zid { color: #a78bfa; margin-bottom: 25px; font-size: 15px; }
        .edit-btn {
            margin-top: 10px;
            padding: 13px 35px;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="back" onclick="window.location.href='index.html'">← Voltar</div>
    <div class="profile-card">
        <div class="avatar">👤</div>
        <div class="name-row">
            <span class="name">Naoki</span>
            <span class="verified">✓</span>
        </div>
        <div class="zid">Z-ID: #000001</div>
        <button class="edit-btn">✏️ Editar Perfil</button>
    </div>
</body>
</html>
