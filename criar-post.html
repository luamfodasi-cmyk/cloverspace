<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Post — CloverSpace</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #120720, #2d1b47, #1a0a2e);
            min-height: 100vh;
            color: white;
            padding: 20px;
        }
        .back {
            padding: 12px 20px;
            background: rgba(167, 139, 250, 0.2);
            border-radius: 10px;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 30px;
        }
        h1 { text-align: center; margin-bottom: 30px; font-size: 24px; }
        .form-card {
            background: rgba(45, 27, 71, 0.6);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            max-width: 450px;
            margin: 0 auto;
        }
        label { display: block; margin-bottom: 8px; color: #a78bfa; font-size: 14px; }
        input, textarea {
            width: 100%; padding: 12px 15px; border-radius: 10px;
            border: 1px solid rgba(167, 139, 250, 0.3);
            background: rgba(18, 7, 32, 0.6); color: white; font-size: 15px;
            margin-bottom: 20px; outline: none;
        }
        input:focus, textarea:focus { border-color: #a78bfa; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(90deg, #7c3aed, #a855f7);
            border: none; border-radius: 12px; color: white;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="back" onclick="window.location.href='criar.html'">← Voltar</div>
    <h1>📝 Criar Post</h1>
    <div class="form-card">
        <label>Título</label>
        <input type="text" placeholder="Digite um título...">
        <label>Conteúdo</label>
        <textarea rows="5" placeholder="Escreva o que você quiser..."></textarea>
        <button onclick="alert('✅ Post criado!'); window.location.href='index.html'">Publicar 🚀</button>
    </div>
</body>
</html>
